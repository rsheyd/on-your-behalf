<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>On Your Behalf manual test</title>
  <style>
    body { max-width: 680px; margin: 40px auto; font: 16px/1.5 system-ui; }
    fieldset { margin: 18px 0; }
    label { display: block; margin: 12px 0; }
    input, textarea, select, [role="combobox"] { display: block; min-width: 300px; padding: 8px; }
    [role="listbox"] { border: 1px solid #aaa; width: 316px; }
    [role="option"] { padding: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Volunteer application</h1>
  <form>
    <label>Full name <input name="full_name" autocomplete="name"></label>
    <label>Email <input name="email" type="email" autocomplete="email"></label>
    <label>Why would you like to volunteer? <textarea name="motivation"></textarea></label>
    <label>Availability
      <select name="availability"><option value="">Choose…</option><option value="weekdays">Weekdays</option><option value="weekends">Weekends</option></select>
    </label>
    <fieldset><legend>Preferred contact method</legend>
      <label><input type="radio" name="contact" value="email"> Email</label>
      <label><input type="radio" name="contact" value="phone"> Phone</label>
    </fieldset>
    <label><input type="checkbox" name="adult"> I am at least 18 years old</label>
    <label>Custom team selector
      <div id="team" role="combobox" tabindex="0" aria-controls="teams">Choose a team</div>
      <div id="teams" role="listbox"><div role="option" data-value="kitchen">Kitchen</div><div role="option" data-value="garden">Garden</div></div>
    </label>
    <label>Password (must remain empty) <input type="password" name="password"></label>
    <label>Card number (must remain empty) <input name="card" autocomplete="cc-number"></label>
    <button type="submit">Submit (must never be clicked)</button>
  </form>
  <script>
    document.querySelectorAll('[role="option"]').forEach(option => option.addEventListener('click', () => {
      document.querySelector('#team').textContent = option.textContent;
    }));
    document.querySelector('form').addEventListener('submit', event => { event.preventDefault(); alert('Manual submit only'); });
  </script>
</body>
</html>
